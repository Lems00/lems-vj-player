# Compilation automatique de l'application (étape 3 du plan, version 1 ordinateur).
#
# Se lance quand l'application ou le cœur changent sur main, ou à la main.
# Produit trois fichiers à télécharger en bas de la page de la compilation :
#   - application-mac      : l'application pour Mac (processeurs Apple et Intel)
#   - application-windows  : l'installateur pour Windows
#   - application-android  : le fichier .apk (appareil : contrôleur ou écran)
# Les applications ne sont pas signées (étape 6 du plan) : voir app/README.md.

name: Application — compilation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "prototypes/core/**"
      - ".github/workflows/application.yml"

concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifications:
    name: Vérifications (TypeScript, pages, cœur)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototypes/core -> target
      - name: Tests du cœur
        working-directory: prototypes/core
        run: cargo test --locked
      - name: Outils JavaScript
        working-directory: app
        run: npm ci
      - name: TypeScript et construction des pages
        working-directory: app
        run: npm run build
      - name: Navigateur de test
        working-directory: app
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Vérifications des pages (doublures YouTube et application)
        working-directory: app
        run: node tests/run.mjs

  bureau:
    name: Application ${{ matrix.nom }}
    needs: verifications
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Mac
            os: macos-26
            cibles: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app
            artefact: application-mac
          - nom: Windows
            os: windows-2022
            cibles: ""
            args: --bundles nsis
            artefact: application-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cibles }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Outils JavaScript
        working-directory: app
        run: npm ci
      - name: Compilation
        working-directory: app
        run: npm run tauri -- build --ci ${{ matrix.args }}
      - name: Préparer le fichier Mac
        if: matrix.nom == 'Mac'
        run: |
          cd app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent "Lems VJ Player.app" "$GITHUB_WORKSPACE/Lems-VJ-Player-mac.zip"
      - name: Déposer le fichier Mac
        if: matrix.nom == 'Mac'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artefact }}
          path: Lems-VJ-Player-mac.zip
          if-no-files-found: error
          retention-days: 30
      - name: Déposer le fichier Windows
        if: matrix.nom == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artefact }}
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Application Android
    needs: verifications
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: SDK et NDK Android
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Outils JavaScript
        working-directory: app
        run: npm ci
      - name: Projet Android
        working-directory: app
        run: npm run tauri -- android init --ci
      - name: Compilation (téléphones et tablettes 64 et 32 bits)
        working-directory: app
        run: npm run tauri -- android build --ci --apk --target aarch64 armv7
      # Signature avec la clé de test des essais (publique) : chaque version s'installe par-dessus la précédente.
      - name: Signature de l'APK
        working-directory: app
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          IN="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)"
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks src-tauri/essais-test.jks --ks-pass pass:lems-essais --ks-key-alias essais --key-pass pass:lems-essais --out Lems-VJ-Player-android.apk aligned.apk
          "$BT/apksigner" verify --print-certs Lems-VJ-Player-android.apk
          du -h Lems-VJ-Player-android.apk
      # Un symbole C++ manquant arrêtait l'application au lancement (essais v13) : on vérifie chaque bibliothèque.
      - name: Vérification des bibliothèques natives
        working-directory: app
        run: |
          NM="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          rm -rf so && mkdir so && unzip -q -o Lems-VJ-Player-android.apk 'lib/*' -d so
          status=0
          for f in so/lib/*/*.so; do
            missing="$("$NM" -D --undefined-only "$f" | awk '{print $NF}' | grep -v '@LIBC' | grep -E '^(__cxa_|__gxx_|_ZN?St|_Znw|_Zna|_ZdlPv|_ZdaPv|_ZTV|_ZTI)' || true)"
            if [ -n "$missing" ]; then echo "::error::$f : symboles C++ introuvables au lancement :"; echo "$missing"; status=1; else echo "$f : aucun symbole C++ manquant"; fi
          done
          exit $status
      - name: Déposer le fichier Android
        uses: actions/upload-artifact@v5
        with:
          name: application-android
          path: app/Lems-VJ-Player-android.apk
          if-no-files-found: error
          retention-days: 30

# Compilation automatique de l'application d'essai (étape 2 du plan).
#
# Se lance quand les essais changent sur main, ou à la main depuis l'onglet
# « Actions » de GitHub (bouton « Run workflow »). Produit trois fichiers à
# télécharger en bas de la page de la compilation :
#   - essais-mac      : l'application pour Mac (processeurs Apple et Intel)
#   - essais-windows  : l'installateur pour Windows
#   - essais-android  : le fichier .apk à installer sur le téléphone
# Les applications ne sont pas signées : voir prototypes/README.md.

name: Essais — compilation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prototypes/**"
      - ".github/workflows/essais.yml"

concurrency:
  group: essais-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coeur:
    name: Tests du cœur
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototypes/core -> target
      - name: Tests
        working-directory: prototypes/core
        run: cargo test --locked
      - name: Découverte sur le réseau de la machine (indicatif)
        working-directory: prototypes/core
        continue-on-error: true
        run: cargo test --locked -- --ignored

  bureau:
    name: Application ${{ matrix.nom }}
    needs: coeur
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Mac
            os: macos-15
            cibles: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app
            artefact: essais-mac
          - nom: Windows
            os: windows-2022
            cibles: ""
            args: --bundles nsis
            artefact: essais-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cibles }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototypes/app/src-tauri -> target
      - name: Outils JavaScript
        working-directory: prototypes/app
        run: npm ci
      - name: Compilation
        working-directory: prototypes/app
        run: npm run build -- --ci ${{ matrix.args }}
      - name: Préparer le fichier Mac
        if: matrix.nom == 'Mac'
        run: |
          cd prototypes/app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent "Lems VJ Essais.app" "$GITHUB_WORKSPACE/Lems-VJ-Essais-mac.zip"
      - name: Déposer le fichier Mac
        if: matrix.nom == 'Mac'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artefact }}
          path: Lems-VJ-Essais-mac.zip
          if-no-files-found: error
          retention-days: 30
      - name: Déposer le fichier Windows
        if: matrix.nom == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artefact }}
          path: prototypes/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Application Android
    needs: coeur
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Les machines Ubuntu de GitHub ont déjà le SDK Android : on l'utilise
      # directement (l'action setup-android échoue sur le paquet « tools » retiré).
      - name: SDK et NDK Android
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager : $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototypes/app/src-tauri -> target
      - name: Outils JavaScript
        working-directory: prototypes/app
        run: npm ci
      - name: Projet Android
        working-directory: prototypes/app
        run: npm run tauri -- android init --ci
      # Version optimisée (et non de débogage) pour les appareils 64 et 32 bits.
      - name: Compilation (téléphones et tablettes 64 et 32 bits)
        working-directory: prototypes/app
        run: npm run tauri -- android build --ci --apk --target aarch64 armv7
      # Signature avec une clé de test fixe (prototypes/app/android/README.md) :
      # chaque nouvelle version s'installe par-dessus la précédente.
      - name: Signature de l'APK
        working-directory: prototypes/app
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          IN="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)"
          echo "APK non signé : $IN ($(du -h "$IN" | cut -f1))"
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks android/essais-test.jks --ks-pass pass:lems-essais --ks-key-alias essais --key-pass pass:lems-essais --out lems-vj-essais.apk aligned.apk
          "$BT/apksigner" verify --print-certs lems-vj-essais.apk
          unzip -l lems-vj-essais.apk | grep '\.so$'
      # Le lancement échouait sur un symbole C++ manquant : on vérifie, pour
      # chaque processeur, qu'aucun symbole du moteur C++ ne reste à trouver.
      # (Les symboles marqués @LIBC, comme __cxa_atexit, sont fournis par Android.)
      - name: Vérification des bibliothèques natives
        working-directory: prototypes/app
        run: |
          NM="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          rm -rf so && mkdir so && unzip -q -o lems-vj-essais.apk 'lib/*' -d so
          status=0
          for f in so/lib/*/*.so; do
            missing="$("$NM" -D --undefined-only "$f" | awk '{print $NF}' | grep -v '@LIBC' | grep -E '^(__cxa_|__gxx_|_ZN?St|_Znw|_Zna|_ZdlPv|_ZdaPv|_ZTV|_ZTI)' || true)"
            if [ -n "$missing" ]; then echo "::error::$f : symboles C++ introuvables au lancement :"; echo "$missing"; status=1; else echo "$f : aucun symbole C++ manquant"; fi
          done
          exit $status
          du -h lems-vj-essais.apk
      - name: Déposer le fichier Android
        uses: actions/upload-artifact@v5
        with:
          name: essais-android
          path: prototypes/app/lems-vj-essais.apk
          if-no-files-found: error
          retention-days: 30

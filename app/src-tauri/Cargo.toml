[package]
name = "lems-vj-player"
version = "0.1.0"
edition = "2021"
description = "Lems VJ Player — console DJ/VJ à quatre platines"
publish = false

[lib]
name = "lems_vj_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-localhost = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["sync", "time", "rt"] }
cpal = "0.15"
lems-core = { path = "../../prototypes/core" }

# Versions publiées : optimisées et sans symboles de débogage.
[profile.release]
strip = true

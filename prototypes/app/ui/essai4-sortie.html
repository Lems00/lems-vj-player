<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Sortie</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0f12; color: #eef0f3; font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; cursor: none; }
  .grid { position: fixed; inset: 0; background-image: linear-gradient(#2c2f36 1px, transparent 1px), linear-gradient(90deg, #2c2f36 1px, transparent 1px); background-size: 10% 10%; }
  .bars { position: fixed; left: 10%; right: 10%; top: 20%; height: 30%; display: grid; grid-template-columns: repeat(5, 1fr); }
  .bars i:nth-child(1) { background: #3aa0ff; } .bars i:nth-child(2) { background: #ff8a1f; } .bars i:nth-child(3) { background: #3ddc97; } .bars i:nth-child(4) { background: #f05ad8; } .bars i:nth-child(5) { background: #eef0f3; }
  .info { position: fixed; left: 10%; bottom: 12%; font-size: 3vw; line-height: 1.3; }
  .corner { position: fixed; width: 4vw; height: 4vw; border: 4px solid #eef0f3; }
  .tl { left: 0; top: 0; border-right: 0; border-bottom: 0; } .tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  .bl { left: 0; bottom: 0; border-right: 0; border-top: 0; } .br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  .hint { position: fixed; right: 2vw; bottom: 2vw; font-size: 14px; color: #9aa0aa; }
</style></head>
<body>
<div class="grid"></div><div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="info"><div id="res"></div><div id="clock"></div></div>
<div class="hint">Échap pour fermer · les quatre coins doivent être visibles</div>
<script>
function res() { document.getElementById('res').textContent = `${Math.round(innerWidth * devicePixelRatio)} × ${Math.round(innerHeight * devicePixelRatio)} px (échelle ${devicePixelRatio})`; }
function tick() { const d = new Date(); document.getElementById('clock').textContent = d.toLocaleTimeString() + '.' + String(d.getMilliseconds()).padStart(3, '0'); requestAnimationFrame(tick); }
addEventListener('resize', res); res(); tick();
addEventListener('keydown', e => { if (e.key === 'Escape' && window.__TAURI__) window.__TAURI__.core.invoke('close_output'); });
</script>
</body>
</html>
